services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malisetu_app
    restart: always
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - malisetu_network

  db:
    image: mysql:8.0
    container_name: malisetu_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: malisetu
      MYSQL_USER: malisetu_user
      MYSQL_PASSWORD: StrongPass@123
      MYSQL_ROOT_PASSWORD: RootSecurePass@123
    volumes:
      - malisetu_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecurePass@123"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - malisetu_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: malisetu_pma
    restart: always
    environment:
      PMA_HOST: malisetu_mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://malisetu.com/phpmyadmin/
      UPLOAD_LIMIT: 100M
    ports:
      - "127.0.0.1:8086:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - malisetu_network

volumes:
  malisetu_mysql_data:
    driver: local

networks:
  malisetu_network:
    driver: bridge
